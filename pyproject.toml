[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Schema-constrained function calling with a small language model"
readme = "README.md"
authors = [
    { name = "hiroki goda", email = "hiroz000qop@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.mypy]
exclude = [
    "^\\.venv/",
    "^experiments/",
    "^llm_sdk/",
]
